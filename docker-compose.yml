name: vera

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vera-api
    container_name: vera-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - vera_data:/app/data
      - ./backend/app/data/sample_kb:/app/app/data/sample_kb:ro
      # Live golden Ask suites (draft Q&A from the KB; edit without image rebuild)
      - ./tests/golden:/app/tests/golden:ro
    environment:
      VERA_DB: ./data/vera.db
      VERA_DATA_DIR: ./data
      VERA_CHROMA_DIR: ./data/chroma
      VERA_CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500
      VERA_WIDGET_PUBLIC_ORIGIN: http://localhost:5173
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vera-web
    container_name: vera-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

volumes:
  vera_data:
